# device.conf — LG V20 Verizon (vs995). Read by every forge script. See forge/device.conf.example.

# ---- identity ----
DEVICE=lge/vs995
DEVICE_CODENAME=vs995
DEVICE_SLUG=vs995
VENDOR=lge
SOC=msm8996                       # Snapdragon 820; gates options that only suit some hardware

# ---- base ----
BRANCH=lineage-24.0
BASE_REF=m/lineage-24.0
# Android 14+ lunch combos are <product>-<release>-<variant>; the 2-part form is invalid on 22.2.
# vendor/lineage defines exactly one release config: bp1a. (Found on the sargo bring-up.)
LUNCH_TARGET=lineage_vs995-cp2a-userdebug
MANIFEST_URL=https://github.com/LineageOS/android.git

# ---- build environment (Android 15 needs 24.04 + JDK 21) ----
UBUNTU_VER=24.04
JDK_VER=21


# ---- projects that carry patches under overlay/patches/ (everything else is an option) ----
PATCHED_PROJECTS="device/lge/msm8996-common device/lge/v20-common device/lge/vs995 hardware/qcom-caf/msm8996/audio hardware/qcom-caf/wlan kernel/lge/msm8996 packages/modules/Connectivity system/bpf vendor/lge/msm8996-common"   # governor retune; build tag; Connectivity+bpf: loaders on a 4.9-class kernel

# ---- GApps ----
# The forge default is NikGapps for Android *11* (inherited from the Robin/ether build). This device
# is lineage-22.2 = Android 15, so it MUST be overridden or a `full` build bakes A11 GApps into an
# A15 ROM. Verified 2026-09-03: HTTP 200, 1,117,912,032 bytes, valid zip.

# ---- build presets: a named set of options, plus the build tag ----
# One build command produces one image. A preset is a saved selection so the combinations you
# actually use do not get retyped; `PRESET=clean ./forge/bootstrap.sh`, or OPTIONS="..." ad hoc.
# Option names come from forge/options/ -- a name with no directory there is an error, not a
# silently ignored word.
# Options every PRESET on this device gets. Keeps the preset rows to what actually differs between
# them. Note this applies to presets only: an ad-hoc OPTIONS="..." replaces the list rather than
# adding to it, so that set is the whole set.
# nav-icons is device-wide: the artwork is ours, redrawn from scratch as vectors, so it is part of the
# look on every device rather than an addition to opt into.
COMMON_OPTIONS="advanced-restart dark-default google-feed-off home-defaults linux livedisplay-off minimal-home nav-icons setup-mobile-data setupwizard-nag-skip teal-skin teal-wallpaper themed-icons"

# clean is bare on purpose: stock LineageOS plus the UI and behaviour options above, no
# third-party apps. libre is the no-Google daily driver -- clean plus F-Droid and Firefox, so
# there is a way to install things without GApps.
# oem is deliberately NOT in any preset: the reclaimed manufacturer assets are a separate
# choice from what apps an image carries. Add them to whichever preset you are building with
# EXTRA_OPTIONS=oem, or once in device.conf.local. The build tag gains -oem automatically, so
# an image holding OEM art can never be mistaken for the shareable one. The same goes for any
# option added that way: EXTRA_OPTIONS=nextcloud builds the Nextcloud bundle onto a preset under
# tag <preset>-nextcloud.
PRESETS="
  full    tag=turbo         options=gapps,fdroid,k9,kdeconnect,connectbot
  clean   tag=turbo-clean   options=
  libre   tag=turbo-libre   options=fdroid,k9,kdeconnect,connectbot
"

# The Robin's own reclaimed assets, on an LG: sounds, wallpapers and the boot animation come from
# Nextbit firmware, not LG's. Deliberate, not a mistake -- this is the house look across these
# builds. nextbit-robin is the only pack the forge has, and it needs the Robin's stock zip, named
# by STOCK_ROM in device.conf.local since it lives outside this repo.
#
# The boot animation is 1080x1920 against this panel's 1440x2560. Same 9:16, so it scales cleanly.
OEM_ASSET_PACK=nextbit-robin

# ---- VoLTE ----
# VoLTE here is LG's own 2016 IMS app rebuilt for Android 17. There is no source for it and none of
# it may be committed, so it is rebuilt from a stock VS995 Nougat system image the user supplies.
# Present -> the `volte` option turns itself on and stage-volte.sh produces the artifacts on the
# first build. Absent -> the build still works, but ships no VoLTE, says so, and tags itself
# -novolte. See IMS.md "Building the IMS stack from stock firmware".
#
# An image, not the KDZ: nothing here reads LG's container format (extract it with kdztools first).
VOLTE_STOCK_GLOB="VS995_Stock_ROM_*.image"
VOLTE_STAGE_SCRIPT=stage-volte.sh
VOLTE_STAGED_MARKER=device/lge/msm8996-common/ims/Ims4-reworked.apk

# On-device Linux environment (chroot + Docker). See forge/modules/linux-chroot.

# VINTF matrix requires CONFIG_FHANDLE=n here and msm8996.mk enforces kernel requirements.
# NikGapps has no Android 17 release, so `gapps` builds MindTheGapps only: Play Store and GMS from
# the manifest, and Lineage's own Calculator/Calendar/Clock/Contacts/Files/Messages/Phone rather
# than Google's. Drop this line when NikGapps publishes for 17.
# MindTheGapps ships Play Services as an APEX with an EROFS payload, and this 4.4 kernel has no
# CONFIG_EROFS_FS -- apexd logs "Mounting failed ... No such device" and com.google.android.gms
# simply never exists, while Play Store, GSF and SetupWizard all install fine. See GOTCHAS 33.
# Turning this on repacks the payload as ext4 and re-signs it, which needs KEYS_DIR.
APEX_EROFS_UNSUPPORTED=true

WITH_GAPPS_EXTRAS=false

WITH_LINUX_FHANDLE=false

# Cap soong_build's Go heap. Analysis here is one process whose peak follows the build graph, not
# JOBS, and a 24.0 tree with a 32-bit second arch lets the heap reach roughly twice the live set.
# Measured without it: RSS held ~22 GB while swap drained 0.8 GB/min toward an OOM kill, so this is
# required rather than a tuning preference. Needs forge's build/soong forwarding patch, which
# soong_ui would otherwise strip along with the rest of the environment.
SOONG_MEM_LIMIT=24GiB
